t Bay of Bengal moved northwestwards with a speed of 14 km/h during past 6 hours and lay centered at 12:42 UTC of 06 September 2026 near latitude 18.42°N and longitude 87.21°E, about 192 km southeast of Puri (Odisha) and 240 km east-northeast of Visakhapatnam (Andhra Pradesh). It is very likely to intensify further into a Very Severe Cyclonic Storm during the next 12 hours.',windWarning:"Gale wind speed reaching 115-125 km/h gusting to 140 km/h is prevailing over Northwest & Westcentral Bay of Bengal. It is likely to increase to 125-135 km/h gusting to 150 km/h from tonight along North Odisha and West Bengal coasts.",heavyRainfallWarning:"Light to moderate rainfall at most places with heavy to very heavy rainfall at a few places and isolated extremely heavy rainfall (>204.4 mm) very likely over coastal districts of Odisha (Puri, Jagatsinghpur, Kendrapara, Bhadrak, Balasore) and West Bengal (South & North 24 Parganas, East Medinipur) on 07th & 08th September.",stormSurgeWarning:"Storm surge of about 2.0 to 3.2 m height above astronomical tide is very likely to inundate low lying areas of Kendrapara, Jagatsinghpur, Bhadrak and East Medinipur districts around the time of landfall.",actionSuggested:"Total suspension of fishing operations over Northwest and adjoining Westcentral Bay of Bengal. Judicious evacuation of vulnerable coastal populations to multi-purpose cyclone shelters. Immediate regulation of shipping, port operations, and rail/road traffic along coastal corridors.",translations:{en:`OFFICIAL CYCLONE BULLETIN (VYOM DECISION SUPPORT)
Target Region: Northern Odisha & West Bengal Coastline
Category: Severe Cyclonic Storm (Ashani)

"Severe cyclonic conditions are expected along the northern Odisha coast and adjoining West Bengal within the next 24–36 hours. District administrations should prepare for strong gale winds (115-135 km/h), heavy rainfall, localized tidal inundation, and secure essential power/telecom lifelines."`,hi:`आधिकारिक चक्रवात बुलेटिन (व्योम निर्णय समर्थन प्रणाली)
लक्षित क्षेत्र: उत्तरी ओडिशा एवं पश्चिम बंगाल तटीय क्षेत्र
श्रेणी: तीव्र चक्रवाती तूफान (अशनी)

"अगले 24-36 घंटों में उत्तरी ओडिशा और निकटवर्ती पश्चिम बंगाल तट पर गंभीर चक्रवाती परिस्थितियां बनने की संभावना है। जिला प्रशासनों को तेज तूफानी हवाओं (115-135 किमी/घंटा), भारी वर्षा और तटीय क्षेत्रों में जलभराव के लिए तुरंत तैयार रहना चाहिए तथा राहत शिविर सक्रिय करने चाहिए।"`,bn:`সরকারি ঘূর্ণিঝড় বুলেটিন (ব্যোম সিদ্ধান্ত সহায়তা প্ল্যাটফর্ম)
লক্ষ্য অঞ্চল: উত্তর ওড়িশা ও পশ্চিমবঙ্গ উপকূল
শ্রেণী: তীব্র ঘূর্ণিঝড় (অশনি)

"পরবর্তী ২৪-৩৬ ঘণ্টার মধ্যে উত্তর ওড়িশা এবং সংলগ্ন পশ্চিমবঙ্গ উপকূল বরাবর তীব্র ঘূর্ণিঝড়ের প্রভাব অনুভূত হবে। জেলা প্রশাসনগুলিকে ১১৫-১৩৫ কিমি/ঘণ্টা বেগে ঝোড়ো হাওয়া, অতি ভারী বৃষ্টিপাত এবং উপকূলীয় প্লাবনের জন্য সর্বোচ্চ সতর্ক থাকতে নির্দেশ দেওয়া হচ্ছে।"`,or:`ସରକାରୀ ବାତ୍ୟା ବୁଲେଟିନ୍ (ବ୍ୟୋମ ନିଷ୍ପତ୍ତି ସହାୟତା ପ୍ଲାଟଫର୍ମ)
ଲକ୍ଷ୍ୟ ଅଞ୍ଚଳ: ଉତ୍ତର ଓଡ଼ିଶା ଏବଂ ପଶ୍ଚିମବଙ୍ଗ ଉପକୂଳ
ବର୍ଗ: ଭୟଙ୍କର ବାତ୍ୟା (ଅଶନି)

"ଆଗାମୀ ୨୪-୩୬ ଘଣ୍ଟା ମଧ୍ୟରେ ଉତ୍ତର ଓଡ଼ିଶା ଉପକୂଳରେ ଭୟଙ୍କର ବାତ୍ୟା ପ୍ରଭାବ ଦେଖାଯିବ। ଜିଲ୍ଲା ପ୍ରଶାସନ ୧୧୫-୧୩୫ କିମି/ଘଣ୍ଟା ବେଗରେ ପ୍ରବାହିତ ପବନ, ପ୍ରବଳ ବର୍ଷା ଏବଂ ଉପକୂଳବର୍ତ୍ତୀ ଜଳପ୍ଳାବନ ପାଇଁ ତୁରନ୍ତ ସମସ୍ତ ପ୍ରସ୍ତୁତି ସମ୍ପୂର୍ଣ୍ଣ କରିବା ସହ ଲୋକଙ୍କୁ ସୁରକ୍ଷିତ ଆଶ୍ରୟସ୍ଥଳୀକୁ ସ୍ଥାନାନ୍ତର କରନ୍ତୁ।"`,te:`అధికారిక తుఫాను హెచ్చరిక (వ్యోమ్ డెసిషన్ సపోర్ట్ సిస్టమ్)
లక్ష్య ప్రాంతం: ఉత్తర ఒడిశా మరియు పశ్చిమ బెంగాల్ తీరం

    <style>
      :root {
        --pitch-cyan: #62e6ff;
        --pitch-amber: #ffb454;
        --pitch-ink: #050b16;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        position: relative;
        isolation: isolate;
        background: var(--pitch-ink) !important;
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
      }

      body::before {
        z-index: -2;
        background-image: url("https://upload.wikimedia.org/wikipedia/commons/thumb/c/cb/Onil_02_oct_2004_0928Z.jpg/1280px-Onil_02_oct_2004_0928Z.jpg?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=thumbnail");
        background-position: center;
        background-size: cover;
        filter: saturate(0.82) contrast(1.08);
        transform: scale(1.03);
      }

      body::after {
        z-index: -1;
        background: transparent;
      }

      #root {
        position: relative;
        z-index: 1;
      }

      #root > div {
        background-color: transparent !important;
      }

      .bg-vyom-void {
        background-color: transparent !important;
      }

      h1,
      h2,
      h3 {
        text-wrap: balance;
      }

      .font-tactical {
        letter-spacing: 0.035em;
      }

      button,
      a,
      [role="button"] {
        transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease, background-color 180ms ease, color 180ms ease;
      }

      button:hover,
      a:hover,
      [role="button"]:hover {
        transform: translateY(-2px);
      }

      button:focus-visible,
      a:focus-visible,
      [role="button"]:focus-visible {
        outline: 2px solid var(--pitch-cyan);
        outline-offset: 3px;
      }

      #root > div [class*="rounded-lg"] {
        transition: transform 220ms ease, border-color 220ms ease, box-shadow 220ms ease;
      }

      #root > div [class*="rounded-lg"]:hover {
        border-color: rgba(98, 230, 255, 0.52);
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.24), 0 0 24px rgba(98, 230, 255, 0.08);
      }

      @media (prefers-reduced-motion: reduce) {
        button,
        a,
        [role="button"],
        #root > div [class*="rounded-lg"] {
          transition: none;
        }

        button:hover,
        a:hover,
        [role="button"]:hover {
          transform: none;
        }
      }

      @media (max-width: 640px) {
        body::before {
          background-position: 62% center;
        }

        body::after {
          background: transparent;
        }
      }

      .theme-toggle {
        top: auto !important;
        right: 1rem !important;
        bottom: 1rem !important;
        color: #06101f;
        background: rgba(98, 230, 255, 0.92);
        border-color: rgba(98, 230, 255, 0.9);
      }

      @media (max-width: 640px) {
        .theme-toggle {
          right: 0.75rem !important;
          bottom: 0.75rem !important;
        }
      }

      .theme-toggle:hover {
        background: #ffffff;
        box-shadow: 0 8px 24px rgba(98, 230, 255, 0.3);
      }

      .active-horizons-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 220px;
        min-height: 52px;
        padding: 0.85rem 1.5rem !important;
        font-size: 0.8rem !important;
        color: #03111f !important;
        background: linear-gradient(135deg, #8ff3ff 0%, #00c8ee 48%, #0878bd 100%) !important;
        border: 2px solid #b9f8ff !important;
        letter-spacing: 0.12em;
        text-shadow: 0 1px 1px rgba(255, 255, 255, 0.35);
        box-shadow: 0 8px 24px rgba(0, 210, 255, 0.45), 0 0 0 3px rgba(0, 210, 255, 0.12);
      }

      .active-horizons-button:hover {
        color: #ffffff !important;
        background: linear-gradient(135deg, #0878bd 0%, #00518b 100%) !important;
        box-shadow: 0 12px 30px rgba(0, 210, 255, 0.62), 0 0 0 4px rgba(143, 243, 255, 0.2);
      }

      html.light body {
        color: #102033;
        background: #dceaf0 !important;
      }

      html.light body::before {
        filter: saturate(0.95) contrast(1.02) brightness(1.08);
      }

      html.light #root > div {
        color: #102033 !important;
      }

      html.light .text-vyom-text {
        color: #102033 !important;
      }

      html.light .text-vyom-muted,
      html.light .text-vyom-subtle {
        color: #35536a !important;
      }

      html.light [class*="bg-vyom-navy"],
      html.light [class*="bg-vyom-panel"] {
        background-color: rgba(242, 249, 251, 0.88) !important;
      }

      html.light [class*="border-vyom-line"] {
        border-color: rgba(47, 91, 112, 0.32) !important;
      }

      html.light .theme-toggle {
        color: #ffffff;
        background: rgba(16, 32, 51, 0.9);
        border-color: rgba(16, 32, 51, 0.85);
      }

    <script>
      (() => {
        const createThemeToggle = () => {
          const button = document.createElement("button");
          const setTheme = (theme) => {
            const isLight = theme === "light";
            document.documentElement.classList.toggle("light", isLight);
            document.documentElement.classList.toggle("dark", !isLight);
            button.textContent = isLight ? "DARK MODE" : "LIGHT MODE";
            button.setAttribute("aria-label", isLight ? "Switch to dark mode" : "Switch to light mode");
          };

          button.type = "button";
          button.className = "theme-toggle fixed top-4 right-4 z-50 rounded-md border px-3 py-2 font-mono text-[10px] font-bold tracking-widest shadow-lg";
          button.addEventListener("click", () => setTheme(document.documentElement.classList.contains("light") ? "dark" : "light"));
          document.body.appendChild(button);
          setTheme("dark");
        };

        document.addEventListener("DOMContentLoaded", createThemeToggle);
      })();
    </script>
